name: Déploiement GitHub Pages

on:
  # Se déclenche après un CI réussi sur main plutôt que sur push : garantit
  # qu'on ne déploie jamais un commit dont lint/typecheck/tests/build ont
  # échoué, y compris en cas de push direct sur main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # attendre la release du commit (VER-09)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Historique et tags complets : la version affichée vient du dernier tag (VER-09).
          fetch-depth: 0
      # Le tag de release est créé par release.yml, en parallèle de la CI : on attend
      # sa fin et on récupère les tags avant de construire (VER-09).
      - name: Attendre la release du commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh .github/scripts/wait-release.sh "${{ github.event.workflow_run.head_sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Un dépôt de projet (pas <user>.github.io) est servi sous
          # /<nom-du-dépôt>/ plutôt qu'à la racine du domaine : voir `base`
          # dans vite.config.ts et src/lib/basePath.ts.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Fallback SPA (routes /roue, /stock… rechargées ou ouvertes directement)
        # GitHub Pages ne connaît pas les routes de l'app : sans ceci, ouvrir ou
        # recharger un lien partagé donnerait un 404 au lieu de servir l'app,
        # qui route elle-même via location.pathname une fois chargée.
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
